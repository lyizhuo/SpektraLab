# android/gradle.properties -- JVM and AndroidX settings for this build.
#
# The engine build is the memory-hungry part (LibRaw + the pipeline in one
# CMake project), so the daemon gets a real heap rather than the 512 MB
# default.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# D9's bytes-per-pixel constant for the memory budget. 180 is the plan's
# conservative default; a device's own measured peak (android/DEVICE-BASELINE.md)
# calibrates it, either here or with -Pspektralab.bytesPerPixel=<value>.
# spektralab.bytesPerPixel=180

# Where the repository is, and where engine/setup-deps.sh put the pinned
# Vulkan-Headers and LibRaw. Both default to something that works when this
# project lives inside the repository (android/ next to engine/); override in
# ~/.gradle/gradle.properties or with -P on the command line when it does not.
# spektralab.repo=/path/to/SpektraLab
# spektralab.depsDir=/path/to/SpektraLab/build/deps
# spektralab.shaderTool=/path/to/glslc-or-glslangValidator
